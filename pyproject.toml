[project]
name = "schedule-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncmy>=0.2.14",
    "cryptography>=50.0.1",
    "elasticsearch[async]>=8.19,<9",
    "fastapi[standard]>=0.141.1",
    "jieba>=0.42.1",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "omegaconf>=2.3.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "ruff>=0.16.8",
]

# 与 shopkeeper-agent 参考项目保持一致的 lint 规则
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
