# 赛事管理 Agent 配置
# 复制 .env.example 为 .env 并填写真实密钥

# 元数据库 schedule_meta：知识库元数据（column_info/metric_info/value_info，问数 Agent 用）
db_meta:
  host: localhost
  port: 3306
  user: buyige
  password: buyige3521
  database: schedule_meta

# 数据仓库 schedule_dw：赛事业务数据（app_user/tournament/team/player/schedule 等 8 张业务表）
db_dw:
  host: localhost
  port: 3306
  user: buyige
  password: buyige3521
  database: schedule_dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  model: BAAI/bge-large-zh-v1.5
  base_url: https://api.siliconflow.cn/v1
  api_key: ${oc.env:LLM_API_KEY}

es:
  host: localhost
  port: 9200
  index_name: tournament_agent

llm:
  model_name: deepseek-ai/DeepSeek-V4-Flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.siliconflow.cn/v1

# 手机号登录 token 签名密钥（生产环境务必通过 .env 设置 TOKEN_SECRET）
auth:
  token_secret: ${oc.env:TOKEN_SECRET,dev-token-secret-change-me}
  token_ttl: 604800

# 问数助手权限矩阵（docs/permission-design.md 第 3/4/8 节）
# role 取值：guest(未登录) / player / organizer / operator / super_admin
query_permissions:
  domains:
    D1: { tables: [tournament] }
    D2: { tables: [team] }
    D3: { tables: [player] }
    D4: { tables: [schedule] }
    D5: { tables: [app_user] }
  roles:
    guest:
      domains: [D1, D2, D4, M]
      row_scope: published
      deny_tables: [player, app_user]
    player:
      # D5 含 app_user 表：登录用户可查，但 phone/guid 敏感列仅本人（validate_sql 校验）
      domains: [D1, D2, D3, D4, D5, M]
      row_scope: published
    organizer:
      domains: [D1, D2, D3, D4, D5, M]
      row_scope: own_plus_published
    operator:
      domains: [D1, D2, D3, D4, D5, M]
      row_scope: all
    super_admin:
      domains: [D1, D2, D3, D4, D5, M]
      row_scope: all
  # 敏感列：非超管引用这些列时必须限定为本人（app_user.id = 当前用户）
  sensitive_columns: ["app_user.phone", "app_user.guid"]
  # 禁止列：任何 SQL 中出现即拒绝（包括超管，防御性兜底）
  forbid_columns: ["app_user.password_hash"]
