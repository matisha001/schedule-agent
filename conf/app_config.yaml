# 赛事管理 Agent 配置
# 复制 .env.example 为 .env 并填写真实密钥

# 元数据库 schedule_meta：知识库元数据（column_info/metric_info/value_info，问数 Agent 用）
db_meta:
  host: localhost
  port: 3306
  user: buyige
  password: buyige3521
  database: schedule_meta

# 数据仓库 schedule_dw：赛事业务数据（app_user/tournament/team/player/schedule 等 8 张业务表）
db_dw:
  host: localhost
  port: 3306
  user: buyige
  password: buyige3521
  database: schedule_dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  model: BAAI/bge-large-zh-v1.5
  base_url: https://api.siliconflow.cn/v1
  api_key: ${oc.env:LLM_API_KEY}

es:
  host: localhost
  port: 9200
  index_name: tournament_agent

llm:
  model_name: deepseek-ai/DeepSeek-V4-Flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.siliconflow.cn/v1

# 手机号登录 token 签名密钥（生产环境务必通过 .env 设置 TOKEN_SECRET）
auth:
  token_secret: ${oc.env:TOKEN_SECRET,dev-token-secret-change-me}
  token_ttl: 604800
